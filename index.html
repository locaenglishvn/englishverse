<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EnglishVerse</title>
<style>
:root{--panel:rgba(255,255,255,.95);--ink:#1f2937;--accent:#e8590c;--ok:#2f9e44;--bad:#c92a2a;color-scheme:light dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--panel:rgba(32,34,42,.95);--ink:#f1f3f5}}
:root[data-theme="dark"]{--panel:rgba(32,34,42,.95);--ink:#f1f3f5}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe8ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
.chip{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;background:var(--panel);color:var(--ink);padding:6px 14px;border-radius:999px;font-weight:700;font-size:15px}
#stick{position:fixed;left:24px;bottom:calc(28px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(0,0,0,.2);touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.9)}
button{font:inherit;cursor:pointer}
#talk{position:fixed;right:24px;bottom:calc(52px + env(safe-area-inset-bottom,0px));display:none;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:16px 24px;font-size:18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#dlg{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:none;background:var(--panel);color:var(--ink);border-radius:18px;padding:16px;box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:560px;margin:0 auto}
#who{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:4px}
#say{font-size:19px;font-weight:600;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;margin-top:8px;padding:12px 14px;border-radius:12px;border:2px solid rgba(128,128,128,.35);background:transparent;color:var(--ink);font-size:16px}
.opt.ok{border-color:var(--ok)}.opt.bad{border-color:var(--bad)}
#fb{margin-top:10px;font-size:15px;min-height:20px}
#mic{display:none;margin-top:10px;background:#1c7ed6;color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:700}
#heard{margin-top:8px;font-size:14px;opacity:.85}
#askBtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;background:var(--panel);color:var(--ink);border:0;border-radius:999px;padding:8px 16px;font-weight:700;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#askp{position:fixed;top:calc(96px + env(safe-area-inset-top,0px));left:10px;right:10px;max-width:560px;margin:0 auto;display:none;background:var(--panel);color:var(--ink);border-radius:18px;padding:14px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
#askp .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#askp .q{border:2px solid rgba(128,128,128,.35);background:transparent;color:var(--ink);border-radius:999px;padding:8px 12px;font-size:15px}
#askMic{background:#1c7ed6;color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:700}
#guide{position:fixed;top:calc(96px + env(safe-area-inset-top,0px));left:10px;right:10px;max-width:560px;margin:0 auto;display:none;background:var(--panel);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:16px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#albumBtn{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));left:12px;background:var(--panel);color:var(--ink);border:0;border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#album{position:fixed;inset:0;z-index:10;display:none;background:rgba(0,0,0,.45);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto}
#album .box{background:var(--panel);color:var(--ink);border-radius:18px;padding:16px;max-width:560px;margin:0 auto}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.card{border:2px solid rgba(128,128,128,.35);border-radius:14px;padding:10px;text-align:center;background:transparent;color:var(--ink)}
.card .pic{font-size:40px;line-height:1.2}.card .w{font-weight:700;margin-top:4px}.card .ex{font-size:13px;opacity:.8;margin-top:4px}
.card.no{opacity:.55}.card.no .pic{filter:grayscale(1)}
#toast{position:fixed;z-index:11;left:50%;top:30%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;background:var(--panel);color:var(--ink);border:3px solid #fab005;border-radius:20px;padding:16px 24px;text-align:center;transition:.3s;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#online{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap}
#namep{position:fixed;inset:0;z-index:12;display:none;background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:16px}
#namep .box{background:var(--panel);color:var(--ink);border-radius:18px;padding:20px;width:100%;max-width:360px;text-align:center}
#nameIn{width:100%;box-sizing:border-box;font:inherit;font-size:20px;padding:12px;border-radius:12px;border:2px solid rgba(128,128,128,.4);margin-top:12px;text-align:center;background:transparent;color:var(--ink);user-select:text;-webkit-user-select:text}
#nameGo{margin-top:12px;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 24px;font-weight:700;font-size:17px}
#sayBtn{position:fixed;right:24px;bottom:calc(144px + env(safe-area-inset-bottom,0px));background:#1c7ed6;color:#fff;border:0;border-radius:999px;padding:12px 18px;font-size:16px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#chatp{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;display:none;background:var(--panel);color:var(--ink);border-radius:18px;padding:14px;box-shadow:0 6px 24px rgba(0,0,0,.3);z-index:5}
#chatList{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#chatList button{border:2px solid rgba(128,128,128,.35);background:transparent;color:var(--ink);border-radius:999px;padding:8px 12px;font-size:15px}
#chatMic{background:#1c7ed6;color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:700}
#mazeBtn{position:fixed;right:24px;bottom:calc(52px + env(safe-area-inset-bottom,0px));display:none;background:#2b8a3e;color:#fff;border:0;border-radius:999px;padding:16px 24px;font-size:18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.panel{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;display:none;background:var(--panel);color:var(--ink);border-radius:18px;padding:16px;box-shadow:0 6px 24px rgba(0,0,0,.3);z-index:6}
.panel .big{display:block;width:100%;margin-top:10px;padding:14px;border-radius:14px;border:0;color:#fff;font-size:17px;font-weight:700;text-align:left}
.team{border-radius:12px;padding:10px;margin-top:8px;border:3px solid}
.team.red{border-color:#e03131}.team.blue{border-color:#1c7ed6}
#mazeHud{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:none;background:#212529;color:#fff;padding:6px 14px;border-radius:999px;font-weight:700;font-size:15px;white-space:nowrap}
#talkBtn{position:fixed;right:18px;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:none;width:104px;height:104px;border-radius:50%;border:0;background:#e8590c;color:#fff;font-size:15px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.35);touch-action:none;-webkit-touch-callout:none}
#talkBtn.rec{background:#c92a2a;transform:scale(1.1)}
#liveText{position:fixed;right:12px;left:12px;bottom:calc(200px + env(safe-area-inset-bottom,0px));display:none;text-align:right;font-size:16px;font-weight:600;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8)}
#mazeLeave{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));right:12px;display:none;background:var(--panel);color:var(--ink);border:0;border-radius:999px;padding:6px 12px;font-weight:700}
.me{background:rgba(250,176,5,.25);border-radius:6px;padding:0 4px}
#atkBtn{position:fixed;right:24px;bottom:calc(52px + env(safe-area-inset-bottom,0px));display:none;background:#7048e8;color:#fff;border:0;border-radius:999px;padding:16px 24px;font-size:18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#fightp .hp{height:10px;border-radius:5px;background:rgba(128,128,128,.3);overflow:hidden;margin-top:6px}#fightp .hp div{height:100%;background:#e03131;transition:width .3s}
#fightSay{font-size:22px;font-weight:700;margin-top:12px;text-align:center}
#fightTime{height:6px;border-radius:3px;background:#7048e8;margin-top:10px;transition:width .1s linear}
#fightMic{display:block;margin:12px auto 0;width:110px;height:110px;border-radius:50%;border:0;background:#7048e8;color:#fff;font-size:15px;font-weight:700;touch-action:none;-webkit-touch-callout:none}
#fightMic.rec{background:#c92a2a;transform:scale(1.08)}#fightMic:disabled{background:#868e96}
#next{display:none;margin-top:10px;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 20px;font-weight:700}
</style>
</head>
<body>
<div class="chip">⭐ <span id="score">0</span></div>
<button id="albumBtn">🎴 <span id="cardCount">0</span></button>
<div id="album"><div class="box">
  <div style="display:flex;justify-content:space-between;align-items:center"><b>🎴 My Cards</b><button class="q" id="albumClose" style="border:0;background:transparent;color:var(--ink);font-size:20px">✕</button></div>
  <div style="font-size:14px;opacity:.8;margin-top:4px">Chạm vào thẻ để nghe lại. Thẻ còn thiếu: hỏi 🧭 Ask để tìm người tặng thẻ!</div>
  <div id="cards"></div>
</div></div>
<div id="toast"></div>
<div id="online">⚪ connecting…</div>
<button id="sayBtn">🗨️ Say</button>
<button id="mazeBtn">🏁 Maze</button>
<div id="lobbyp" class="panel"></div>
<div id="matchp" class="panel"></div>
<div id="mazeHud"></div>
<button id="mazeLeave">✕ Leave</button>
<button id="talkBtn">🎤<br>Hold to talk</button>
<div id="liveText"></div>
<button id="atkBtn">📢 Attack</button>
<div id="fightp" class="panel">
  <div style="display:flex;justify-content:space-between;align-items:center"><b id="fightName">👻 Echo Ghost</b><button id="fightRun" style="border:0;background:transparent;color:var(--ink);font-weight:700">🏃 Run</button></div>
  <div class="hp"><div id="fightHp" style="width:100%"></div></div>
  <div style="font-size:13px;margin-top:8px;opacity:.8">📢 Repeat after the ghost to free it! / Lặp lại câu con ma nói để giải thoát nó!</div>
  <div id="fightSay"></div>
  <div style="text-align:center"><button id="fightListen" style="border:0;background:transparent;color:var(--ink);font-size:15px">🔊 Listen again</button></div>
  <div id="fightTime"></div>
  <button id="fightMic">📢<br>Hold &amp; repeat</button>
  <div id="fightFb" style="text-align:center;margin-top:8px;min-height:22px;font-weight:600"></div>
</div>
<div id="chatp">
  <div style="display:flex;gap:8px;align-items:center;justify-content:space-between">
    <button id="chatMic">🎤 Nói tiếng Anh</button>
    <button id="chatClose" style="border:0;background:transparent;color:var(--ink);font-size:20px">✕</button>
  </div>
  <div id="chatHeard" style="margin-top:6px;font-size:14px"></div>
  <div id="chatList"></div>
</div>
<div id="namep"><div class="box">
  <div style="font-size:22px;font-weight:700">Welcome to EnglishVerse! 👋</div>
  <div style="margin-top:8px">What’s your name?</div>
  <input id="nameIn" maxlength="12" placeholder="e.g. Lily" autocomplete="off">
  <div id="nameErr" style="font-size:14px;margin-top:8px;color:var(--bad)"></div>
  <button id="nameGo">Let’s go! ▶</button>
</div></div>
<div id="stick"><div id="knob"></div></div>
<button id="talk">💬 Talk</button>
<button id="askBtn">🧭 Ask</button>
<div id="askp">
  <div style="font-weight:700">Bạn muốn tìm ai / chỗ nào? Hãy hỏi bằng tiếng Anh!</div>
  <div class="row"><button id="askMic">🎤 Nói: “Where is …?”</button><button class="q" id="askHint">💡 Gợi ý</button><button class="q" id="askClose">✕</button></div>
  <div id="askHeard" style="margin-top:8px;font-size:14px"></div>
  <div class="row" id="askList" style="display:none"></div>
</div>
<div id="guide"></div>
<div id="dlg">
  <div id="who"></div><div id="say"></div><div id="choices"></div><button id="mic">🎤 Nói câu trả lời</button><div id="heard"></div><div id="fb"></div>
  <button id="next">Next ▶</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.89.0/dist/umd/supabase.js"></script>
<script src="lessons.js"></script>
<script>
/* ===== 2. DỰNG CẢNH 3D ===== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe8ff);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 220);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.position.set(5, 10, 6);
scene.add(sun);

function box(w, h, d, color, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color }));
  m.position.set(x, y, z);
  scene.add(m);
  return m;
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(16, 13), new THREE.MeshLambertMaterial({ color: 0xe9d8b4 }));
floor.rotation.x = -Math.PI / 2;
floor.position.set(0, 0, 0.5);
scene.add(floor);
box(16, 1.6, 0.3, 0xf4a261, 0, 0.8, -6);      // tường sau
box(0.3, 1.6, 13, 0xf4a261, -8, 0.8, 0.5);    // tường trái
box(0.3, 1.6, 13, 0xf4a261, 8, 0.8, 0.5);     // tường phải
box(6.5, 1.6, 0.3, 0xf4a261, -4.75, 0.8, 7);  // tường trước (trái cửa)
box(6.5, 1.6, 0.3, 0xf4a261, 4.75, 0.8, 7);   // tường trước (phải cửa)
const obstacles = [];
function solid(x, z, hw, hd) { obstacles.push({ x, z, hw, hd }); }
solid(-8, 0.5, 0.15, 6.5); solid(8, 0.5, 0.15, 6.5); solid(-4.75, 7, 3.25, 0.15); solid(4.75, 7, 3.25, 0.15);
function blocked(x, z) {
  if (maze) return maze.solids.some(o => Math.abs(x - o.x) < o.hw + 0.6 && Math.abs(z - o.z) < o.hd + 0.6);   // đang trong mê cung (giữ cách tường 0,6 m)
  if (x < -34 || x > 34 || z < -5.4 || z > 48) return true;   // ranh giới thị trấn
  return obstacles.some(o => Math.abs(x - o.x) < o.hw + 0.45 && Math.abs(z - o.z) < o.hd + 0.45);
}
box(10.2, 0.08, 1.2, 0xf1f3f5, 0, 1.04, -3.2);
box(3, 1.4, 1, 0x6c4a2f, -6.5, 0.7, -3.2);
box(3, 1.4, 1, 0x6c4a2f, 6.5, 0.7, -3.2);
box(0.7, 0.5, 0.5, 0x343a40, 1.4, 1.33, -3.3);
solid(0, -3.2, 5, 0.5); solid(-6.5, -3.2, 1.5, 0.5); solid(6.5, -3.2, 1.5, 0.5);
box(10, 1, 1, 0xd62828, 0, 0.5, -3.2);         // quầy
function chair(x, z, side) {
  box(0.5, 0.08, 0.5, 0xc9a227, x, 0.45, z);
  box(0.08, 0.5, 0.5, 0xc9a227, x + side * 0.22, 0.75, z);
  box(0.12, 0.4, 0.12, 0x6c757d, x, 0.2, z);
  solid(x, z, 0.3, 0.3);
}
function table(x, z) {
  const top = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 0.1, 20), new THREE.MeshLambertMaterial({ color: 0x8d5524 }));
  top.position.set(x, 0.8, z);
  const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.8, 8), new THREE.MeshLambertMaterial({ color: 0x495057 }));
  leg.position.set(x, 0.4, z);
  scene.add(top, leg);
  solid(x, z, 0.7, 0.7);
  chair(x - 1.15, z, -1);
  chair(x + 1.15, z, 1);
}
[[-4.5, 0.5], [4.5, 0.5], [-4.5, 4.5]].forEach(q => table(q[0], q[1]));   // bàn
table(4.5, 4.5);

/* ===== 2b. THỊ TRẤN BÊN NGOÀI QUÁN (mỗi khu sẽ là một "trạm") ===== */
scene.fog = new THREE.Fog(0xcfe8ff, 30, 70);
const skyC = document.createElement("canvas"); skyC.width = 2; skyC.height = 256;   // bầu trời: xanh đậm trên đỉnh → nhạt ở chân trời
const skyG = skyC.getContext("2d"), grd = skyG.createLinearGradient(0, 0, 0, 256);
grd.addColorStop(0, "#2f80ed"); grd.addColorStop(0.6, "#8cc4ff"); grd.addColorStop(1, "#cfe8ff");
skyG.fillStyle = grd; skyG.fillRect(0, 0, 2, 256);
const sky = new THREE.Mesh(new THREE.SphereGeometry(150, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2),
  new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(skyC), side: THREE.BackSide, fog: false, depthWrite: false }));
sky.renderOrder = -1; scene.add(sky);
const clouds = [];
for (let i = 0; i < 10; i++) {   // mây: vài quả cầu trắng ghép lại, trôi chậm
  const c = new THREE.Group(), mat = new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0x888888, fog: false });
  for (let k = 0; k < 4; k++) { const b = new THREE.Mesh(new THREE.SphereGeometry(3 + Math.random() * 2.5, 12, 10), mat); b.position.set(k * 3.5 - 5, Math.random() * 1.5, Math.random() * 2); b.scale.y = 0.6; c.add(b); }
  const a = i / 10 * Math.PI * 2, r = 70 + Math.random() * 40;
  c.position.set(Math.cos(a) * r, 35 + Math.random() * 15, 20 + Math.sin(a) * r); c.userData.a = a; c.userData.r = r;
  scene.add(c); clouds.push(c);
}
flat(400, 400, 0x8fd17a, 0, 20, -0.04);   // cỏ trải tới chân trời
function flat(w, d, color, x, z, y) {   // mặt phẳng nằm trên đất: cỏ, đường, quảng trường
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshLambertMaterial({ color }));
  m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); scene.add(m);
}
flat(72, 58, 0x8fd17a, 0, 21, -0.02);     // cỏ
flat(3, 11, 0xbfb6a8, 0, 12.5, 0.01);      // đường: quán → quảng trường
flat(14, 14, 0xdedad2, 0, 24, 0.01);       // quảng trường
flat(14, 3, 0xbfb6a8, 14, 24, 0.01);       // đường: → nhà ga
flat(14, 3, 0xbfb6a8, -14, 24, 0.01);      // đường: → cổng mê cung
flat(3, 5, 0xbfb6a8, 0, 33.5, 0.01);       // đường: → công viên
function sign(text, x, z, w) {   // biển tên có chữ, quay về phía camera lúc đầu
  const c = document.createElement("canvas"); c.width = 512; c.height = 128;
  const g = c.getContext("2d");
  g.fillStyle = "#fff8e7"; g.fillRect(0, 0, 512, 128);
  g.strokeStyle = "#6c4a2f"; g.lineWidth = 12; g.strokeRect(6, 6, 500, 116);
  g.fillStyle = "#3b2a1a"; g.font = "bold 60px system-ui, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(text, 256, 68);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, w / 4), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), side: THREE.DoubleSide }));
  m.position.set(x, 2.6, z); scene.add(m);
  box(0.12, 2.6, 0.12, 0x6c4a2f, x - w / 2 + 0.15, 1.3, z);
  box(0.12, 2.6, 0.12, 0x6c4a2f, x + w / 2 - 0.15, 1.3, z);

function makeChar(bodyColor) {   // nhân vật chibi: đầu to, thân nhỏ, tay chân vung khi đi

function animateChars(dt) {   // vung tay chân theo tốc độ di chuyển
  for (let i = chars.length - 1; i >= 0; i--) {
    const g = chars[i], u = g.userData;
    if (!g.parent) { chars.splice(i, 1); continue; }
    const sp = Math.hypot(g.position.x - u.last.x, g.position.z - u.last.z) / Math.max(dt, 0.001);
    u.last.copy(g.position);
    const amp = Math.min(1, sp / 3) * 0.7;
    u.phase += dt * (4 + sp * 2);
    const sw = Math.sin(u.phase) * amp;
    u.legs[0].rotation.x = sw; u.legs[1].rotation.x = -sw;
    u.arms[0].rotation.x = -sw; u.arms[1].rotation.x = sw;
  }
}

  const r = stick.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const len = Math.hypot(dx, dy), max = 40;
  if (len > max) { dx = dx / len * max; dy = dy / len * max; }

}

/* ===== 4b. NHẬN DIỆN GIỌNG NÓI (Web Speech API, miễn phí, chạy trong trình duyệt) ===== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function norm(s) { return s.toLowerCase().replace(/[’']/g, "").replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(Boolean); }
function lcs(a, b) {  // dãy từ chung dài nhất, GIỮ THỨ TỰ từ nên nói sai trật tự sẽ bị nhận ra
  const d = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = a[i - 1] === b[j - 1] ? d[i - 1][j - 1] + 1 : Math.max(d[i - 1][j], d[i][j - 1]);
  return d[a.length][b.length];
}
function match(choice, heard) {  // 0..1: câu nói giống đáp án bao nhiêu
  const A = norm(choice), B = norm(heard);
  if (!A.length || !B.length) return 0;
  const l = lcs(A, B);
  return l / B.length >= 0.5 ? l / A.length : 0;
}
function listen() {
  if (!SR) return;
  try { speechSynthesis.cancel(); } catch (e) {}
  const r = new SR();
  r.lang = "en-US"; r.interimResults = false; r.maxAlternatives = 3;
  $("mic").textContent = "🎙️ Listening…"; $("mic").disabled = true;
  const done = () => { $("mic").textContent = "🎤 Nói câu trả lời"; $("mic").disabled = false; };
  r.onresult = e => {
    const alts = Array.from(e.results[0]).map(a => a.transcript);
    $("heard").textContent = "Heard: “" + alts[0] + "”";
    let best = null, bs = 0;
    NPC.steps[step].choices.forEach(c => alts.forEach(h => { const m = match(c.t, h); if (m > bs) { bs = m; best = c; } }));
    if (best && bs >= 0.6) best.btn.click();
    else $("heard").textContent += " – chưa khớp, thử nói lại nhé!";
  };
  r.onerror = e => {
    $("heard").textContent = (e.error === "not-allowed" || e.error === "service-not-allowed")
      ? "Chưa được cấp quyền micro. Hãy cho phép micro, hoặc chọn đáp án bằng tay."
      : "Không nghe được, thử lại hoặc chọn bằng tay.";
  };
  r.onend = done;
  try { r.start(); } catch (err) { done(); }
}
$("mic").onclick = listen;

const PLACES = [   // các địa điểm trong thị trấn (NPC lấy tự động từ LESSONS)

/* ===== 7. ĐÁNH QUÁI: ECHO GHOST (bản thử đầu tiên) =====

const ECHO_LINES = [   // câu theo độ khó: 1 = rất dễ, 2 = dễ, 3 = khó hơn
  [1, "Hello!"], [1, "Thank you!"], [1, "Good morning!"], [1, "I am happy."], [1, "Nice to meet you."],
  [2, "Where is the park?"], [2, "I like green tea."], [2, "Can you help me?"], [2, "It is a sunny day."], [2, "How much is it?"],
  [3, "I would like an iced coffee, please."], [3, "Could you tell me the way to the station?"], [3, "I am not afraid of making mistakes."]
];
const GHOST_ZONE = { x0: -12, x1: 12, z0: 36, z1: 46 };   // ma xuất hiện ở công viên
flat(26, 12, 0x9aa5b1, 0, 41, 0.005);   // nền xám: khu bị sương The Mute bao phủ
sign("Misty Park", -6, 34.5, 3.4);
const ghosts = [];
function makeGhost(lv) {
  const g = new THREE.Group();

  const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.03, 6, 12), eyeM); mouth.position.set(0, 1.35, 0.55); g.add(mouth);
  g.add(head, body);
  const tag = nameTag("Echo Ghost Lv." + lv); tag.position.y = 2.5; g.add(tag);
  scene.add(g);
  const G = { g, mat, lv, hpMax: 40 + lv * 30, hp: 0, tx: 0, tz: 0, alive: true };

}
function spawnGhost(G) {
  const z = GHOST_ZONE;
  G.g.position.set(z.x0 + Math.random() * (z.x1 - z.x0), 0, z.z0 + Math.random() * (z.z1 - z.z0));
  G.hp = G.hpMax; G.alive = true; G.g.visible = true; G.mat.opacity = 0.85; G.mat.color.setHex(0xdee2e6);

[1, 1, 2].forEach(makeGhost);
function playerLevel() { return 1 + Math.floor(score / 60); }   // tạm: cấp = theo số sao
function pickLine(G) {   // chọn đề riêng cho người chơi này
  const mine = allCards().filter(c => owned.indexOf(c.w) >= 0).map(c => c.ex);   // câu trong thẻ đã có → ôn tập
  const want = Math.min(3, Math.max(1, Math.ceil((playerLevel() + G.lv) / 2)));
  const r = Math.random();
  let pool;
  if (mine.length && r < 0.5) pool = mine;
  else if (r < 0.8) pool = ECHO_LINES.filter(l => l[0] === want).map(l => l[1]);
  else pool = ECHO_LINES.filter(l => l[0] === Math.min(3, want + 1)).map(l => l[1]);   // i+1: khó hơn một chút

}
let fight = null, nearGhost = null, fightRec = null;
function updateGhosts(dt, t) {
  nearGhost = null;
  ghosts.forEach(G => {
    if (!G.alive) return;
    const p = G.g.position;
    if (fight && fight.G === G) G.g.lookAt(player.position.x, 0, player.position.z);
    else {   // đi lang thang chậm trong công viên
      if (Math.hypot(G.tx - p.x, G.tz - p.z) < 0.3) { const z = GHOST_ZONE; G.tx = z.x0 + Math.random() * (z.x1 - z.x0); G.tz = z.z0 + Math.random() * (z.z1 - z.z0); }
      const dx = G.tx - p.x, dz = G.tz - p.z, d = Math.hypot(dx, dz) || 1;
      p.x += dx / d * 0.8 * dt; p.z += dz / d * 0.8 * dt;

    }

  });

    const a = t * 1.5 + i * 2.1;

}

/* ===== 5. VÒNG LẶP GAME (chạy ~60 lần/giây) ===== */
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  let mx = input.x, mz = input.z;
  if (keys["a"] || keys["arrowleft"]) mx -= 1;
  if (keys["d"] || keys["arrowright"]) mx += 1;
  if (keys["w"] || keys["arrowup"]) mz -= 1;
  if (keys["s"] || keys["arrowdown"]) mz += 1;
  const len = Math.hypot(mx, mz);
  if (keys["q"]) camAngle -= 1.8 * dt;
  if (keys["e"]) camAngle += 1.8 * dt;
  if (maze && maze.role === "walker") {   // góc nhìn thứ nhất: trái/phải = xoay người, lên/xuống = đi tới/lùi
    camAngle -= mx * 2.2 * dt;
    if (Math.abs(mz) > 0.1) {
      const k = -Math.max(-1, Math.min(1, mz)) * 3 * dt, wx = -Math.sin(camAngle) * k, wz = -Math.cos(camAngle) * k;
      if (!blocked(player.position.x + wx, player.position.z)) player.position.x += wx;
      if (!blocked(player.position.x, player.position.z + wz)) player.position.z += wz;
    }
    player.rotation.y = camAngle + Math.PI;
  } else if (!maze && !talking && len > 0.1) {
    const k = Math.min(len, 1) / len * 4 * dt;
    const c = Math.cos(camAngle), s = Math.sin(camAngle);
    const wx = (mx * c + mz * s) * k, wz = (-mx * s + mz * c) * k;
    if (!blocked(player.position.x + wx, player.position.z)) player.position.x += wx;
    if (!blocked(player.position.x, player.position.z + wz)) player.position.z += wz;
    player.rotation.y = Math.atan2(wx, wz);
  }
  LESSONS.forEach(L => L.mark.position.set(L.x, 2.2 + Math.sin(t * 3) * 0.12, L.z));
  updateGuide(dt, t);
  updateOnline(dt);
  updateMazeGate();
  updateMaze();
  updateGhosts(dt, t);
  animateChars(dt);
  clouds.forEach(c => { c.userData.a += dt * 0.004; c.position.x = Math.cos(c.userData.a) * c.userData.r; c.position.z = 20 + Math.sin(c.userData.a) * c.userData.r; });
  if (!talking) {
    near = null;
    let best = 3.3;
    LESSONS.forEach(L => { const d = player.position.distanceTo(L.mesh.position); if (d < best) { best = d; near = L; } });
    $("talk").style.display = near ? "block" : "none";
  }
  const p = player.position;
  if (maze && maze.role === "walker") {   // walker: nhìn ngang tầm mắt
    camera.position.set(p.x, 1.5, p.z);
    camera.lookAt(p.x - Math.sin(camAngle), 1.4, p.z - Math.cos(camAngle));
  } else if (maze) {   // guide: nhìn thẳng từ trên cao xuống cả mê cung
    const cx = maze.ox + MZ.W * MZ.C / 2, cz = maze.oz + MZ.H * MZ.C / 2, half = MZ.W * MZ.C / 2 + 4;
    const vt = Math.tan(camera.fov * Math.PI / 360), ht = vt * camera.aspect;
    camera.position.set(cx, half / Math.min(vt, ht), cz + 0.01);
    camera.lookAt(cx, 0, cz);
  } else {
    if (keys["r"]) camPitch = Math.max(0.1, camPitch - 1.2 * dt);
    if (keys["f"]) camPitch = Math.min(1.35, camPitch + 1.2 * dt);
    const D = 11, ch = Math.cos(camPitch) * D;
    camera.position.lerp(new THREE.Vector3(p.x + Math.sin(camAngle) * ch, 1 + Math.sin(camPitch) * D, p.z + Math.cos(camAngle) * ch), 0.12);
    camera.lookAt(p.x, 0.9 + (1 - camPitch / 1.35) * 1.4, p.z);   // càng nhìn ngang càng ngẩng lên thấy trời
  }
  sky.position.set(camera.position.x, 0, camera.position.z);   // trời luôn bao quanh camera
  renderer.render(scene, camera);
}
loop();
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
