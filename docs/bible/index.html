<title>EnglishVerse Game Bible</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Bố cục: thanh tab dính trên cùng, mỗi tab một trang; nội dung rộng tối đa 1120px, lưới thẻ tự xuống dòng trên điện thoại */
:root{
  --bg:#f3f6f7; --panel:#ffffff; --sunk:#e8eef0; --ink:#17232b; --muted:#5a6b75; --line:#d5dfe3;
  --teal:#13877d; --teal-soft:#d9f1ee; --gold:#b9861a; --gold-soft:#f8ecd0; --mute:#7b5cd6;
  --c-common:#8b97a1; --c-uncommon:#2f9e44; --c-rare:#2b7bd9; --c-epic:#8150d8; --c-legendary:#c98a05;
  --display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif; --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171b; --panel:#162227; --sunk:#1d2b31; --ink:#e6eef1; --muted:#97a9b2; --line:#26363d;
  --teal:#3cc7b8; --teal-soft:#123a37; --gold:#e3b34a; --gold-soft:#3a2f16; --mute:#a98cf5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171b; --panel:#162227; --sunk:#1d2b31; --ink:#e6eef1; --muted:#97a9b2; --line:#26363d;
  --teal:#3cc7b8; --teal-soft:#123a37; --gold:#e3b34a; --gold-soft:#3a2f16; --mute:#a98cf5; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1120px;margin:0 auto}
header.top{background:var(--panel);border-bottom:1px solid var(--line)}
header.top .inner{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-block:14px 6px}
.brand{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;color:var(--teal);margin:0}
.brand span{color:var(--ink)}
.built{color:var(--muted);font-size:12px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);border-bottom:1px solid var(--line)}
nav.tabs .inner{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:6px}
nav.tabs .inner::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;padding:7px 12px;border-radius:10px;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--teal);color:#fff}
nav.tabs a:focus-visible,button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
main{padding-block:22px 60px}
h1.pg{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0 0 4px;text-wrap:balance}
.lede{color:var(--muted);max-width:70ch;margin:0 0 20px}
h2{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.2;margin:30px 0 10px;text-wrap:balance}
h3{font-size:16px;margin:0 0 4px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card p{margin:4px 0}
.muted{color:var(--muted)}
.small{font-size:13px}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));margin:8px 0 6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:30px;line-height:1;color:var(--teal);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.pill.new{background:var(--gold-soft);color:var(--gold)}
.pill.have{background:var(--teal-soft);color:var(--teal)}
.rar{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.chips button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:5px 11px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:var(--sunk);position:sticky;top:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
ul.tight{margin:4px 0;padding-left:18px}
ul.tight li{margin:2px 0}
.md{max-width:78ch}
.kc{margin:6px 0;padding:6px 10px;border:1px dashed var(--line);border-radius:10px}
.art-p{margin-top:8px;font-size:13px}
.art-p summary{cursor:pointer;color:var(--teal);font-weight:600}
.prompt{background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;user-select:all}
.copy{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
.portrait{margin:-4px -6px 8px;border-radius:10px;overflow:hidden;background:var(--sunk);aspect-ratio:4/3}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:center 35%}
.portrait.none{display:grid;place-items:center;font-size:13px;color:var(--muted);text-align:center;padding:10px;aspect-ratio:auto;min-height:60px}
.wow{margin:6px 0;padding:8px 10px;border-radius:10px;background:var(--gold-soft);font-weight:600;line-height:1.45}
.md h1{font-family:var(--display);font-size:30px;line-height:1.15}
.md h2{font-size:22px}
.md h3{font-size:17px;margin-top:20px}
.md table{display:block;overflow-x:auto;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.md blockquote{margin:12px 0;padding:8px 14px;border-left:4px solid var(--teal);background:var(--panel);border-radius:0 10px 10px 0}
.md code{background:var(--sunk);padding:1px 5px;border-radius:5px;font-size:13px}
.md img{border-radius:10px}
/* quái */
.mon{display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.mon .art{aspect-ratio:1/1;border-radius:10px;background:var(--sunk);overflow:hidden;display:grid;place-items:center;font-size:44px}
.mon .art img{width:100%;height:100%;object-fit:cover}
.mon b{font-family:var(--display);font-size:17px;line-height:1.15}
.tier{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--mute)}
.ov{position:fixed;inset:0;z-index:20;background:rgba(5,12,15,.55);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov[hidden]{display:none}
.ov .box{background:var(--panel);border-radius:16px;max-width:760px;width:100%;max-height:100%;overflow:auto;padding:18px}
.ov .box .two{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px}
@media (max-width:640px){.ov .box .two{grid-template-columns:minmax(0,1fr)}}
.ov .box img{width:100%;border-radius:12px}
.close{float:right;font:inherit;border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:10px;padding:4px 12px;cursor:pointer}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
/* nhân vật chính */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.hero figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hero img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center}
.hero figcaption{font-size:12px;color:var(--muted);padding:6px 10px}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.flow span{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px}
.flow i{color:var(--muted);font-style:normal}
.branch{border-top:4px solid var(--c)}
a{color:var(--teal)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<header class="top pad"><div class="inner">
  <p class="brand">English<span>Verse</span></p>
  <span class="muted">Sổ tay thiết kế game</span>
  <span class="built" id="built"></span>
</div></header>
<nav class="tabs pad" aria-label="Các mục"><div class="inner" id="tabs"></div></nav>
<main class="pad"><div class="inner" id="view"></div></main>
<div class="ov" id="ov" hidden><div class="box" id="ovBox" role="dialog" aria-modal="true"></div></div>

<script src="marked.min.js"></script>
<script src="data.js"></script>
<script src="core-npcs.js"></script>
<script src="scholars.js"></script>
<script>
(function(){
const B = window.BIBLE, NPC = window.CORE_NPCS || [];
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const md = s => window.marked ? marked.parse(s) : "<pre style='white-space:pre-wrap'>" + esc(s) + "</pre>";
const RC = r => "var(--c-" + (r || "common") + ")";
const num = n => Number(n).toLocaleString("vi-VN");
document.getElementById("built").textContent = "Dữ liệu lấy từ code ngày " + B.built;

const AREA = { vn:"🌾 Khu Việt", jp:"⛩️ Nhật", eg:"🏜️ Ai Cập", no:"❄️ Bắc Âu", ce:"🍁 Celt", my:"🏝️ Maya", gr:"🏛️ Hy Lạp", cn:"🖌️ Trung Hoa", me:"🗿 Lưỡng Hà", pa:"✨ Thần & The Mute" };
const areaOf = m => m.area || "vn";
const skills = Object.entries(B.SKILLS).map(([id, s]) => Object.assign({ id }, s));
const weapons = Object.entries(B.W_LINES).reduce((n, [k, v]) => n + v.names.length, 0);

/* ---------------- các trang ---------------- */
const PAGES = [
 { id:"tong-quan", name:"Tổng quan", render(){
   const deckN = Object.values(B.deck).reduce((a, d) => a + d.n, 0) + B.sounds.n + B.starterDeck.length;
   const S = [[B.monsters.length,"quái, trùm, thần trong sổ tay"],[B.monsters.filter(m=>m.img).length,"ảnh concept đã chốt"],[B.npcs.length,"NPC trong thành phố"],[NPC.length,"NPC cốt lõi (đề xuất)"],[(window.SCHOLARS||[]).length,"danh nhân khôi phục tri thức"],[skills.length,"chiêu thức · 4 nhánh"],[B.items.length + weapons,"vật phẩm, trang phục, vũ khí"],[B.cards.vocab + B.cards.phrase + B.cards.question,"thẻ học sưu tầm được"],[deckN,"đề nói trong ngân hàng"],[B.CHALLENGES.length,"dạng bài nói"],[8,"khu văn hoá thế giới"]];
   return `<h1 class="pg">EnglishVerse</h1>
   <p class="lede">Metaverse 3D trên điện thoại cho học sinh Việt Nam. Người chơi là một <b>Voice</b>, dùng tiếng Anh nói thành tiếng làm phép để giải thoát thế giới khỏi The Mute. Tiếng Anh là công cụ để chơi và để thắng, không phải môn học.</p>
   <div class="stats">${S.map(([n,t])=>`<div class="stat"><b>${num(n)}</b><span>${t}</span></div>`).join("")}</div>
   <h2>Vòng chơi chính</h2>
   <div class="flow"><span>🏙️ Học nói với NPC trong Verse City</span><i>→</i><span>🎴 Nhận thẻ câu nói, câu hỏi, từ vựng</span><i>→</i><span>🌫️ Ra vùng hoang dã, nói để tung chiêu</span><i>→</i><span>✨ Giải thoát Word Spirit, rơi đồ</span><i>→</i><span>⬆️ Lên cấp, mở khu mới, dạng bài mới</span></div>
   <h2>Đi nhanh tới</h2>
   <div class="grid sm">${PAGES.slice(1).map(p=>`<a class="card" style="text-decoration:none;color:inherit" href="#${p.id}"><h3>${p.name}</h3><p class="small muted">${p.blurb||""}</p></a>`).join("")}</div>
   <div class="md">${md("## Tầm nhìn" + B.roadmap1)}</div>`; } },
 { id:"cot-truyen", name:"Cốt truyện", blurb:"Vocara, The Mute, Babel Tower, 8 khu văn hoá", render(){ return `<div class="md">${md(B.story)}</div>`; } },
 { id:"nhan-vat", name:"Nhân vật chính", blurb:"Voice Guard nam / nữ, tỉ lệ 3,9 đầu, cách chia món", render(){
   const F = (f, c) => `<figure><img src="concept/characters/${f}" alt="${c}" loading="lazy"><figcaption>${c}</figcaption></figure>`;
   return `<h1 class="pg">Nhân vật chính · The Voice Guard</h1>
   <p class="lede">Người chơi chọn nam hoặc nữ. Cả hai bắt đầu bằng đồng phục Voice Guard. Ảnh dưới đây là ảnh chốt để đưa vào Tripo (dựng 3D có xương).</p>
   <div class="hero">${F("voice-guard-m.webp","Nam · trước")}${F("voice-guard-m-side.webp","Nam · nghiêng")}${F("voice-guard-m-back.webp","Nam · sau")}${F("voice-guard-f.webp","Nữ · trước")}${F("voice-guard-f-side.webp","Nữ · nghiêng")}${F("voice-guard-f-back.webp","Nữ · sau")}</div>
   <h2>Đã chốt</h2>
   <div class="grid">
    <div class="card"><h3>Tỉ lệ 3,9 đầu</h3><p>Kiểu chibi nhẹ: chân dài, thân thon, đầu vẫn hơi to và dễ thương. Mũ, nón, tóc bồng làm đầu trông to thêm.</p></div>
    <div class="card"><h3>Tính cách hình ảnh</h3><p><b>Nam:</b> mặt lạnh, nam tính, tự tin. Áo gile xanh ngọc viền vàng, áo trắng dài tay.</p><p><b>Nữ:</b> tươi tắn, xinh. Áo khoác xanh ngọc, váy xếp ly navy.</p></div>
    <div class="card"><h3>Chia món trang bị</h3><ul class="tight"><li><b>Giáp thân</b> = áo + quần gộp 1 món (Tripo, có xương)</li><li><b>Đầu + tóc, giày, mũ, vũ khí</b> = món cứng gắn vào khớp (đầu, bàn chân, tay)</li><li>Không có balo</li><li>Cùng 1 món: nam mặc ra kiểu nam, nữ ra kiểu nữ</li></ul></div>
    <div class="card"><h3>Đẹp nhờ đâu</h3><p>Lớp màu vẽ sẵn từ Tripo, tà áo và tóc lay, hiệu ứng (viền sáng, hào quang, vệt chém). Không ghép khối bằng code.</p></div>
   </div>
   <h2>Phong cách nhân vật</h2>
   <p class="md">Chibi hoạt hình 3D mềm, mặt thân thiện, màu tươi, trang phục kín đáo, có thể mang chất Việt (hoa văn mây, nón lá, áo bà ba). Không dùng: low-poly góc cạnh, anh hùng dáng người lớn, trang phục hở. Ảnh game thương mại chỉ để tham khảo, không chép.</p>`; } },
 { id:"npc", name:"NPC", blurb:"NPC cốt lõi + toàn bộ NPC thành phố", render(){
   const places = [...new Set(B.npcs.map(n => n.place))].sort();
   return `<h1 class="pg">Sổ tay NPC</h1>
   <p class="lede">NPC cốt lõi gắn với cốt truyện và một hệ thống trong game, mỗi người có mô hình riêng. NPC thường dùng thân gốc nam / nữ, máy tự phối đồ.</p>
   <h2>NPC cốt lõi <span class="pill new">đề xuất, chờ duyệt</span></h2>
   <div class="grid">${NPC.map(n => `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:start"><h3>${n.emo} ${esc(n.name)}</h3><span class="pill ${n.status}">${n.status === "new" ? "mới" : "đã có"}</span></div>
     <p class="small muted">📍 ${esc(n.where)} · mở ${esc(n.lv)}</p><p>${esc(n.story)}</p>
     <p class="small" style="margin-top:8px"><b>Chức năng</b></p><ul class="tight small">${n.jobs.map(j => `<li>${esc(j)}</li>`).join("")}</ul>
     <p class="small muted" style="margin-top:8px">👗 ${esc(n.look)}</p><p class="small muted">Đề xuất bởi: ${esc(n.who)}</p>${(window.NPC_ART || {})[n.id] ? artBlock([NPC_ART[n.id]], NPC_TAIL) : ""}</div>`).join("")}</div>
   <h2>Tất cả NPC trong thành phố · ${B.npcs.length}</h2>
   <div class="chips" id="npcF"><button data-v="all" aria-pressed="true">Tất cả</button>${places.map(p => `<button data-v="${esc(p)}">${esc(p)}</button>`).join("")}</div>
   <div class="tbl"><table><thead><tr><th>NPC</th><th>Ở đâu</th><th>Cấp</th><th>Thẻ</th><th>Câu mở đầu</th></tr></thead><tbody id="npcT"></tbody></table></div>`; },
   after(){ const T = document.getElementById("npcT");
     const draw = f => T.innerHTML = B.npcs.filter(n => f === "all" || n.place === f).map(n => `<tr><td>${esc(n.name)}${n.keeper ? ' <span class="pill">chủ quán</span>' : ""}</td><td>${esc(n.place)}</td><td class="num">Lv.${n.minLv}</td><td class="num">${n.cards} 💬 · ${n.qs} ❓</td><td class="small">${esc(n.first)}</td></tr>`).join("");
     chips("npcF", draw); draw("all"); } },
 { id:"danh-nhan", name:"Danh nhân", blurb:"30 danh nhân khôi phục tri thức bị Oblivia xoá", render(){
   const SC = window.SCHOLARS || [], CH = window.SCHOLAR_CHAPTERS || [];
   return `<h1 class="pg">Danh nhân · Khôi phục tri thức</h1>
   <p class="lede">Tướng Oblivia đã xoá khoa học của nhân loại. Khi Babel Tower đủ mạnh, The Knowledge Collector gọi linh hồn danh nhân về. Mỗi nhiệm vụ là một phát minh thật của họ, học bằng tiếng Anh (CLIL). Xong một danh nhân thì nhận 🎴 thẻ kiến thức: một câu tiếng Anh dễ nhớ về khoa học. Làm xong thì khôi phục một công trình trong thành phố. <span class="pill new">đề xuất, chờ duyệt</span></p>
   <div class="stats"><div class="stat"><b>${SC.length}</b><span>danh nhân</span></div><div class="stat"><b>${SC.reduce((a, s) => a + s.quests.length, 0)}</b><span>nhiệm vụ (mỗi phát minh 1 nhiệm vụ)</span></div><div class="stat"><b>${SC.filter(s => /Việt Nam/.test(s.from)).length}</b><span>danh nhân Việt Nam</span></div><div class="stat"><b>${SC.filter(s => ((window.SCHOLAR_ART || {})[s.name] || {}).img).length}/${SC.length}</b><span>đã có ảnh chốt</span></div></div>
   <p class="small"><b>Vẽ ảnh còn thiếu:</b> mở <b>cuộc trò chuyện Gemini mới cho mỗi người</b> (vẽ liền nhiều người trong một cuộc, Gemini sẽ dùng lại cùng khuôn mặt), đính kèm ảnh Voice Guard nam, dán câu lệnh của người đó.</p>
   <h2>📗 Sổ Tri Thức: nơi ghi nhận nhiệm vụ <span class="pill new">đề xuất</span></h2>
   <div class="grid">
    <div class="card"><h3>Mỗi danh nhân 1 trang</h3><p>Sổ Tri Thức là tab thứ 4 trong Sổ thẻ 🎴. Mỗi trang có chân dung danh nhân và một hàng ô huy hiệu, mỗi ô là một phát minh (bóng đèn, vắc-xin, máy bay…).</p></div>

/* ---------------- tiện ích ---------------- */
const NPC_TAIL = " Respectful, modest, kid-friendly. Hands empty. Full body, A-pose (arms angled down 30°), front view, plain light grey background, no text, no logo.";
function artBlock(list, tail, extra){ if (!list || !window.ART_STYLE) return "";
  return `<details class="art-p"><summary>🎨 Câu lệnh vẽ Gemini${list.length > 1 ? " · " + list.length + " ảnh" : ""}</summary>${extra || ""}${list.map(d => { const t = ART_STYLE + d + tail; return `<p class="prompt">${esc(t)}</p><button class="copy" data-t="${esc(t)}">Chép câu lệnh</button>`; }).join("")}</details>`; }
document.addEventListener("click", e => { const b = e.target.closest(".copy"); if (!b) return; const t = b.dataset.t;
  const ok = () => { b.textContent = "Đã chép ✓"; setTimeout(() => b.textContent = "Chép câu lệnh", 1500); };
  const fall = () => { const r = document.createRange(); r.selectNodeContents(b.previousElementSibling); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); b.textContent = "Đã chọn, bấm Copy"; };
  try { navigator.clipboard.writeText(t).then(ok, fall); } catch (_) { fall(); } });
function chips(id, fn){ const el = document.getElementById(id); el.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  el.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); fn(b.dataset.v); }); }
const ov = document.getElementById("ov"), ovBox = document.getElementById("ovBox");
function openMon(m){ if (!m) return;
  ovBox.innerHTML = `<button class="close" id="ovX">Đóng</button><span class="tier">${esc(B.tierName[m.tier] || m.tier)}</span><h2 style="margin-top:2px">${m.emo} ${esc(m.name)}</h2><p class="muted" style="margin-top:-6px">${esc(m.vn)} · ${esc(m.zone)}</p>
   <div class="two">${m.img ? `<img src="${m.img}" alt="${esc(m.name)}">` : `<div class="mon"><div class="art">${m.emo}</div></div>`}
   <div><p>${esc(m.lore)}</p>${m.mean ? `<p><b>Lời chưa nói:</b> ${esc(m.mean)}</p>` : ""}${m.idiom ? `<p><b>Thành ngữ:</b> ${esc(m.idiom)}</p>` : ""}
   <p><b>Thân:</b> ${esc(m.body)}</p><ul class="tight">${(m.shape || []).map(s => `<li>${esc(s)}</li>`).join("")}</ul>
   <p>${(m.pal || []).map(([c, n]) => `<span class="sw" style="background:${c}"></span>${esc(n)}`).join(" &nbsp; ")}</p>
   <p><b>Tính cách:</b> ${esc(m.pers)}</p><p><b>Cách đánh:</b> ${esc(m.fight)}</p></div></div>`;
  ov.hidden = false; document.getElementById("ovX").focus(); }
ov.addEventListener("click", e => { if (e.target === ov || e.target.id === "ovX") ov.hidden = true; });
addEventListener("keydown", e => { if (e.key === "Escape") ov.hidden = true; });

const tabs = document.getElementById("tabs"), view = document.getElementById("view");
tabs.innerHTML = PAGES.map(p => `<a href="#${p.id}">${p.name}</a>`).join("");
function route(){ const id = (location.hash || "").slice(1), P = PAGES.find(p => p.id === id) || PAGES[0];
  view.innerHTML = P.render(); if (P.after) P.after(); ov.hidden = true;
  tabs.querySelectorAll("a").forEach(a => { const on = a.getAttribute("href") === "#" + P.id; a.toggleAttribute("aria-current", on); if (on) { a.setAttribute("aria-current", "page"); a.scrollIntoView({ block:"nearest", inline:"center" }); } });
  window.scrollTo(0, 0); }
addEventListener("hashchange", route); route();
})();
</script>
